name: Release Android libmpv

on:
  push:
    tags:
      - '*'

  workflow_dispatch:
    inputs:
      version:
        description: "Release to tag and publish, without the leading v (e.g. 0.1.12-lgpl-8). Leave empty for a build-only run."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkg-config libtool ninja-build python3-pip
          sudo pip3 install meson

      - name: Build the release artifacts
        run: |
          set -x
          unset ANDROID_SDK_ROOT
          cd buildscripts
          ./download.sh > /dev/null
          ./buildall.sh --arch x86 mpv
          ./buildall.sh --arch x86_64 mpv
          ./buildall.sh --arch arm64 mpv
          ./buildall.sh
        env:
          GRADLE_OPTS: -Xmx4G
      # One run does the whole release. A manual run WITH a version behaves like pushing the tag
      # "v<version>": the tag is created at this commit in the publish step, after the build
      # succeeded, and the immutable release is published in the same run. A manual run without a
      # version is build-only, as before. A tag push behaves as it always has.
      - name: Resolve release tag
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"; release=1
          elif [[ -n "${{ inputs.version }}" ]]; then
            tag="v${{ inputs.version }}"
            [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "version must look like 0.1.12-lgpl-8"; exit 1; }
            release=1
          else
            tag=""; release=0
          fi
          echo "VERSION_TAG=${tag}" >> "${GITHUB_ENV}"
          echo "RELEASE=${release}" >> "${GITHUB_ENV}"
          echo "tag=${tag} release=${release}"
      - name: Copy build artifacts
        if: env.RELEASE == '1'
        run: |
          set -euo pipefail
          mkdir -p dist
          mv lib/build/outputs/aar/lib-release.aar "dist/mpv-android-lib-${VERSION_TAG}.aar"
          cp buildscripts/include/depinfo.sh dist/build-inputs.sh
          cat > dist/build-manifest.txt <<EOF
          recipe_commit=${GITHUB_SHA}
          release_tag=${VERSION_TAG}
          license_mode=LGPL_no_GPL
          architectures=arm64-v8a,armeabi-v7a,x86,x86_64
          EOF
          (cd dist && sha256sum *.aar build-inputs.sh build-manifest.txt > SHA256SUMS.txt)

      - name: Upload workflow artifact
        if: env.RELEASE == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-libmpv-${{ env.VERSION_TAG }}
          path: dist/*
          if-no-files-found: error

      - name: Attest release evidence
        if: env.RELEASE == '1'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*.aar
            dist/SHA256SUMS.txt

      - name: Publish immutable GitHub Release
        if: env.RELEASE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${VERSION_TAG}"
          # A manual run with a version has no tag yet: create it at this commit so the release,
          # the attestation and "git checkout <tag>" agree. Only reached after a successful build.
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          fi
          state=$(gh release view "${tag}" --json isDraft,isImmutable,targetCommitish 2>/dev/null || true)
          if [ -z "${state}" ]; then
            gh release create "${tag}" --draft --target "${GITHUB_SHA}" \
              --title "FlowVid Android libmpv ${tag}" \
              --notes "Pinned four-ABI LGPL libmpv build with manifest, checksums and provenance."
          elif [ "$(jq -r '.isImmutable' <<<"${state}")" = "true" ]; then
            for file in dist/*; do
              name=$(basename "${file}")
              local_digest="sha256:$(sha256sum "${file}" | cut -d' ' -f1)"
              remote_digest=$(gh release view "${tag}" --json assets \
                --jq ".assets[] | select(.name == \"${name}\") | .digest")
              test "${remote_digest}" = "${local_digest}"
            done
            echo "Immutable release ${tag} already matches this build."
            exit 0
          else
            test "$(jq -r '.isDraft' <<<"${state}")" = "true"
            test "$(jq -r '.targetCommitish' <<<"${state}")" = "${GITHUB_SHA}"
          fi
          gh release upload "${tag}" dist/* --clobber
          gh release edit "${tag}" --draft=false
          test "$(gh release view "${tag}" --json isImmutable --jq '.isImmutable')" = "true"
