name: Release Android libmpv

on:
  push:
    tags:
      - '*'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkg-config libtool ninja-build python3-pip
          sudo pip3 install meson

      - name: Build the release artifacts
        run: |
          set -x
          unset ANDROID_SDK_ROOT
          cd buildscripts
          ./download.sh > /dev/null
          ./buildall.sh --arch x86 mpv
          ./buildall.sh --arch x86_64 mpv
          ./buildall.sh --arch arm64 mpv
          ./buildall.sh
        env:
          GRADLE_OPTS: -Xmx4G
      - name: Get tag name
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -x
          echo "VERSION_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
      - name: Copy build artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          mkdir -p dist
          mv lib/build/outputs/aar/lib-release.aar "dist/mpv-android-lib-${VERSION_TAG}.aar"
          cp buildscripts/include/depinfo.sh dist/build-inputs.sh
          cat > dist/build-manifest.txt <<EOF
          recipe_commit=${GITHUB_SHA}
          release_tag=${VERSION_TAG}
          license_mode=LGPL_no_GPL
          architectures=arm64-v8a,armeabi-v7a,x86,x86_64
          EOF
          (cd dist && sha256sum *.aar build-inputs.sh build-manifest.txt > SHA256SUMS.txt)

      - name: Upload workflow artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-libmpv-${{ env.VERSION_TAG }}
          path: dist/*
          if-no-files-found: error

      - name: Attest release evidence
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*.aar
            dist/SHA256SUMS.txt

      - name: Publish immutable GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${VERSION_TAG}"
          state=$(gh release view "${tag}" --json isDraft,isImmutable,targetCommitish 2>/dev/null || true)
          if [ -z "${state}" ]; then
            gh release create "${tag}" --draft --target "${GITHUB_SHA}" \
              --title "FlowVid Android libmpv ${tag}" \
              --notes "Pinned four-ABI LGPL libmpv build with manifest, checksums and provenance."
          elif [ "$(jq -r '.isImmutable' <<<"${state}")" = "true" ]; then
            for file in dist/*; do
              name=$(basename "${file}")
              local_digest="sha256:$(sha256sum "${file}" | cut -d' ' -f1)"
              remote_digest=$(gh release view "${tag}" --json assets \
                --jq ".assets[] | select(.name == \"${name}\") | .digest")
              test "${remote_digest}" = "${local_digest}"
            done
            echo "Immutable release ${tag} already matches this build."
            exit 0
          else
            test "$(jq -r '.isDraft' <<<"${state}")" = "true"
            test "$(jq -r '.targetCommitish' <<<"${state}")" = "${GITHUB_SHA}"
          fi
          gh release upload "${tag}" dist/* --clobber
          gh release edit "${tag}" --draft=false
          test "$(gh release view "${tag}" --json isImmutable --jq '.isImmutable')" = "true"
